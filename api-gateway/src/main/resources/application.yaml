server:
  port: 8080

spring:
  output:
    ansi:
      enabled: always
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: users-ms-auth
              uri: http://localhost:8081
              predicates:
                - Path=/api/auth/**

            - id: users-ms-info
              uri: http://localhost:8081
              predicates:
                - Path=/api/users/info
              filters:
                - RewritePath=/api/users/info, /

            - id: users-ms
              uri: http://localhost:8081
              predicates:
                - Path=/api/users/**

            - id: users-ms-api-docs
              uri: http://localhost:8081
              predicates:
                - Path=/api/docs/openapi/users
              filters:
                - RewritePath=/api/docs/openapi/users, /v3/api-docs

            - id: workout-ms-routines
              uri: http://localhost:8082
              predicates:
                - Path=/api/routines/**

            - id: workout-ms-sessions
              uri: http://localhost:8082
              predicates:
                - Path=/api/workout-sessions/**

            - id: workout-ms-exercises
              uri: http://localhost:8082
              predicates:
                - Path=/api/exercises/**

            - id: workout-ms-personal-records
              uri: http://localhost:8082
              predicates:
                - Path=/api/personal-records/**

            - id: workout-ms-info
              uri: http://localhost:8082
              predicates:
                - Path=/api/workout/info
              filters:
                - RewritePath=/api/workout/info, /

            - id: workout-ms-api-docs
              uri: http://localhost:8082
              predicates:
                - Path=/api/docs/openapi/workout
              filters:
                - RewritePath=/api/docs/openapi/workout, /v3/api-docs

            - id: social-ms-follows
              uri: http://localhost:8083
              predicates:
                - Path=/api/follows/**

            - id: social-ms-info
              uri: http://localhost:8083
              predicates:
                - Path=/api/social/info
              filters:
                - RewritePath=/api/social/info, /

            - id: social-ms-api-docs
              uri: http://localhost:8083
              predicates:
                - Path=/api/docs/openapi/social
              filters:
                - RewritePath=/api/docs/openapi/social, /v3/api-docs

            - id: posts-ms-info
              uri: http://localhost:8084
              predicates:
                - Path=/api/posts/info
              filters:
                - RewritePath=/api/posts/info, /

            - id: posts-ms
              uri: http://localhost:8084
              predicates:
                - Path=/api/posts/**

            - id: posts-ms-api-docs
              uri: http://localhost:8084
              predicates:
                - Path=/api/docs/openapi/posts
              filters:
                - RewritePath=/api/docs/openapi/posts, /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info

security:
  jwt:
    issuer: users-ms
    secret: ${JWT_SECRET}

springdoc:
  api-docs:
    path: /api/docs/openapi
  swagger-ui:
    path: /api/docs/swagger-ui.html
    urls:
      - name: users-ms
        url: /api/docs/openapi/users
      - name: workout-ms
        url: /api/docs/openapi/workout
      - name: social-ms
        url: /api/docs/openapi/social
      - name: posts-ms
        url: /api/docs/openapi/posts
    urls-primary-name: users-ms
