<article class="flex gap-4">
  <div class="group/profile relative shrink-0">
    <div
      class="grid size-12 cursor-default place-items-center rounded-2xl bg-yellow-400 text-sm font-black tracking-[-0.04em] text-zinc-950 shadow-lg shadow-yellow-400/15 outline-none transition duration-200 hover:-translate-y-0.5 hover:shadow-yellow-400/35 focus-visible:-translate-y-0.5 focus-visible:ring-4 focus-visible:ring-yellow-400/25"
      tabindex="0"
      [attr.aria-describedby]="profileTooltipId()"
      (mousedown)="$event.preventDefault()"
    >
      {{ authorInitials() }}
    </div>

    <app-profile-hover-card
      [tooltipId]="profileTooltipId()"
      [fullName]="authorName()"
      [username]="authorUsername()"
      [initials]="authorInitials()"
    />
  </div>

  <div class="min-w-0 flex-1">
    <header class="flex flex-wrap items-center gap-2">
      <h2 class="font-black tracking-[-0.03em] text-zinc-50">{{ authorName() }}</h2>
      <span class="text-sm font-medium text-zinc-500">&#64;{{ authorUsername() }}</span>
      <span class="text-sm text-zinc-600">·</span>
      <time class="text-sm font-medium text-zinc-500">{{ formattedDate() }}</time>
      <span class="rounded-full border border-yellow-400/30 bg-yellow-400/10 px-2 py-1 text-xs font-black uppercase tracking-widest text-yellow-400">
        {{ postTypeLabel() }}
      </span>
    </header>

    <p class="mt-3 text-[15px] leading-7 text-zinc-200">
      {{ post().caption || 'Entrenamiento registrado en IronFeed.' }}
    </p>

    @if (post().imageUrl) {
      <img
        class="mt-4 aspect-video w-full rounded-3xl border border-zinc-800 object-cover"
        [src]="post().imageUrl"
        alt="Imagen del post"
      />
    }

    <footer class="mt-5 flex flex-wrap gap-3 text-xs font-black uppercase tracking-[0.16em] text-zinc-500">
      <span class="rounded-full bg-zinc-900 px-3 py-2">{{ post().reactionCount }} impulsos</span>
      <span class="rounded-full bg-zinc-900 px-3 py-2">{{ post().commentCount }} comentarios</span>
      <span class="rounded-full bg-yellow-400/10 px-3 py-2 text-yellow-400">Ver post</span>
    </footer>
  </div>
</article>
