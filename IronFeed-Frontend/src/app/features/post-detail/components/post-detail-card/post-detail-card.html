<article class="post-detail-card mx-6 mt-6 rounded-[2rem] border border-yellow-400/20 bg-zinc-950 p-6">
  <header class="flex gap-4">
    <div class="group/profile relative shrink-0">
      <img
        class="size-14 rounded-2xl border border-yellow-400/25 bg-yellow-400 object-contain p-3 shadow-lg shadow-yellow-400/25 outline-none transition duration-200 hover:-translate-y-0.5 hover:shadow-yellow-400/35 focus-visible:-translate-y-0.5 focus-visible:ring-4 focus-visible:ring-yellow-400/25"
        src="/assets/profile.svg"
        [alt]="'Foto de perfil de ' + authorName()"
      />
    </div>

    <div class="min-w-0 flex-1">
      <div class="min-w-0">
        <h2 class="truncate text-xl font-black tracking-[-0.05em] text-zinc-50">
          {{ authorName() }}
        </h2>
        <div class="mt-1 flex flex-wrap items-center gap-2">
          <span class="text-sm font-bold text-yellow-400">&#64;{{ authorUsername() }}</span>
          <span class="text-sm text-zinc-600">·</span>
          <time class="text-sm font-bold text-zinc-500">{{ formattedDate() }}</time>
        </div>
      </div>
    </div>
  </header>

  <p class="mt-6 text-xl leading-9 tracking-[-0.02em] text-zinc-100">
    {{ post().caption || 'Entrenamiento registrado en IronFeed.' }}
  </p>

  @if (post().imageUrl) {
    <img
      class="mt-6 aspect-video w-full rounded-[1.75rem] border border-zinc-800 object-cover"
      [src]="post().imageUrl"
      alt="Imagen de la publicación"
    />
  }

  <footer class="mt-6 flex flex-wrap gap-5 border-t border-zinc-800/80 pt-5 text-xs font-black uppercase tracking-[0.16em] text-zinc-500">
    <span>{{ post().reactionCount }} impulsos</span>
    <span>{{ post().commentCount }} comentarios</span>
  </footer>
</article>
