<form class="mx-6 mt-7 rounded-[1.75rem] border border-yellow-400/15 bg-zinc-950 p-5 shadow-xl shadow-black/20" (submit)="submitComment($event)">
  <label class="text-[10px] font-black uppercase tracking-[0.3em] text-yellow-400" for="comment-content">
    Responder
  </label>

  <textarea
    id="comment-content"
    class="mt-4 min-h-28 w-full resize-none rounded-3xl border border-zinc-800 bg-zinc-900/70 px-4 py-4 text-sm leading-6 text-zinc-100 outline-none transition placeholder:text-zinc-600 focus:border-yellow-400/70 focus:bg-zinc-950 focus:ring-4 focus:ring-yellow-400/10 disabled:cursor-not-allowed disabled:opacity-60"
    placeholder="Escribí tu comentario..."
    [attr.maxlength]="maxLength"
    [disabled]="isSubmitting()"
    [value]="content()"
    (input)="updateContent($event)"
  ></textarea>

  <div class="mt-3 flex flex-wrap items-center justify-between gap-3">
    <p class="text-xs font-bold text-zinc-500">
      {{ charactersUsed() }}/{{ maxLength }} caracteres
    </p>

    <button
      class="rounded-full bg-yellow-400 px-5 py-2.5 text-sm font-black text-zinc-950 transition hover:-translate-y-0.5 hover:bg-yellow-300 focus-visible:outline-none focus-visible:ring-4 focus-visible:ring-yellow-400/30 disabled:cursor-not-allowed disabled:opacity-50 disabled:hover:translate-y-0 disabled:hover:bg-yellow-400"
      type="submit"
      [disabled]="!canSubmit()"
    >
      {{ isSubmitting() ? 'Comentando...' : 'Comentar' }}
    </button>
  </div>

  @if (errorMessage()) {
    <p class="mt-4 rounded-2xl border border-yellow-400/20 bg-yellow-400/10 px-4 py-3 text-sm font-bold text-yellow-400">
      {{ errorMessage() }}
    </p>
  }
</form>
