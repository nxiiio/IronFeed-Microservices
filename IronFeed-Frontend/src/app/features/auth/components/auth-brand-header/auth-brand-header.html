<a class="auth-brand" [routerLink]="homeLink()" [attr.aria-label]="ariaLabel()">
  <span class="auth-brand-mark">
    {{ brandInitials() }}
  </span>
  <span>
    <span class="auth-brand-name">{{ brandName() }}</span>
    <span class="auth-brand-tagline">
      {{ tagline() }}
    </span>
  </span>
</a>
