<aside class="featured-panel rounded-3xl border border-zinc-800/80 bg-zinc-900/70 p-5">
  <div class="flex items-center justify-between gap-4">
    <div>
      <p class="text-[11px] font-black uppercase tracking-[0.28em] text-yellow-400">
        Destacados
      </p>
      <h2 class="mt-1 text-xl font-black tracking-[-0.05em] text-zinc-50">
        Ejercicios
      </h2>
    </div>

    <span class="rounded-full bg-yellow-400 px-3 py-1 text-xs font-black tracking-[-0.02em] text-zinc-950">
      Gym
    </span>
  </div>

  <div class="mt-5 space-y-3">
    @for (exercise of exercises(); track exercise.id; let index = $index) {
      <article
        class="exercise-card rounded-2xl border border-zinc-800/80 bg-zinc-950/90 p-4"
        [style.animation-delay.ms]="index * 90"
      >
        <div class="flex items-start justify-between gap-3">
          <div>
            <h3 class="font-black tracking-[-0.03em] text-zinc-50">
              {{ exercise.name }}
            </h3>

            <p class="mt-1 text-[11px] font-black uppercase tracking-[0.2em] text-yellow-400">
              {{ exercise.muscleGroup ?? 'General' }}
            </p>
          </div>

          <span class="pulse-dot text-lg text-yellow-400">●</span>
        </div>

        @if (exercise.description) {
          <p class="mt-3 line-clamp-2 text-sm leading-6 text-zinc-500">
            {{ exercise.description }}
          </p>
        }
      </article>
    } @empty {
      <p class="empty-state rounded-2xl border border-dashed border-zinc-800 px-4 py-6 text-sm text-zinc-500">
        Todavía no hay ejercicios destacados.
      </p>
    }
  </div>
</aside>
