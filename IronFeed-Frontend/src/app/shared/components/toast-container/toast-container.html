<section
  class="pointer-events-none fixed right-5 top-5 z-50 flex w-[min(92vw,24rem)] flex-col gap-3"
  aria-label="Notificaciones"
  aria-live="polite"
>
  @for (toast of toasts(); track toast.id) {
    <article [class]="toastClasses(toast.type)" role="status">
      <div class="flex items-start gap-3">
        <span [class]="iconClasses(toast.type)" aria-hidden="true">
          {{ iconFor(toast.type) }}
        </span>

        <div class="min-w-0 flex-1">
          <h2 class="text-sm font-black tracking-[-0.02em] text-zinc-100">
            {{ toast.title }}
          </h2>

          @if (toast.message) {
            <p class="mt-1 text-sm leading-5 text-zinc-400">
              {{ toast.message }}
            </p>
          }
        </div>

        <button
          class="rounded-full px-2 text-xl leading-none text-zinc-500 transition hover:bg-zinc-800 hover:text-zinc-100"
          type="button"
          aria-label="Cerrar notificación"
          (click)="dismiss(toast.id)"
        >
          ×
        </button>
      </div>
    </article>
  }
</section>
