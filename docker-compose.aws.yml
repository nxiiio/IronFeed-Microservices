services:
  postgres:
    image: postgres:15.17-alpine3.22
    container_name: ironfeed-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  users-ms:
    build:
      context: ./users-ms
    container_name: ironfeed-users-ms
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: docker,prod
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  workout-ms:
    build:
      context: ./workout-ms
    container_name: ironfeed-workout-ms
    environment:
      SPRING_PROFILES_ACTIVE: docker,prod
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8082/actuator/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  social-ms:
    build:
      context: ./social-ms
    container_name: ironfeed-social-ms
    environment:
      SPRING_PROFILES_ACTIVE: docker,prod
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8083/actuator/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  posts-ms:
    build:
      context: ./posts-ms
    container_name: ironfeed-posts-ms
    environment:
      SPRING_PROFILES_ACTIVE: docker,prod
    depends_on:
      postgres:
        condition: service_healthy
      users-ms:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8084/actuator/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  api-gateway:
    build:
      context: ./api-gateway
    container_name: ironfeed-api-gateway
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "8080:8080"
    depends_on:
      users-ms:
        condition: service_healthy
      workout-ms:
        condition: service_healthy
      social-ms:
        condition: service_healthy
      posts-ms:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  postgres_data:
